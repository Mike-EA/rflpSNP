<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b0d"/><stop offset="1" stop-color="#121619"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .title{font:700 48px Arial,sans-serif;fill:#f5f5f5}.accent{fill:#a3e635}.sub{font:400 23px Arial,sans-serif;fill:#c9cdd2}.step{font:700 22px Arial,sans-serif;fill:#f5f5f5;text-anchor:middle}.label{font:700 17px Arial,sans-serif;fill:#a3e635;text-anchor:middle}.small{font:400 16px Arial,sans-serif;fill:#c9cdd2;text-anchor:middle}.tiny{font:400 14px Arial,sans-serif;fill:#bfc5ca;text-anchor:middle}.node{fill:#a3e635}.line{stroke:#e5e7eb;stroke-width:3;fill:none}.green{stroke:#a3e635;stroke-width:3;fill:none}.purple{stroke:#c084fc;stroke-width:3;fill:none}.box{fill:#0e1317;stroke:#4b5563;stroke-width:2}.branch{fill:#0d1515;stroke:#a3e635;stroke-width:2}.arms{fill:#15111a;stroke:#c084fc;stroke-width:2}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="none" stroke="#e5e7eb" stroke-width="1.5"/></marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="none" stroke="#a3e635" stroke-width="1.5"/></marker>
    <marker id="arrowp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="none" stroke="#c084fc" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="800" y="72" class="title" text-anchor="middle"><tspan class="accent">rflpSNP</tspan> Workflow</text>
  <text x="800" y="110" class="sub" text-anchor="middle">In silico design and simulation of SNP genotyping assays</text>

  <circle cx="180" cy="200" r="25" class="node"/><text x="180" y="208" class="step" fill="#0b0f12">1</text>
  <text x="180" y="250" class="step">Reference sequence</text>
  <rect x="100" y="282" width="160" height="150" rx="12" class="box"/><path d="M220 282v42h40" class="line"/><text x="125" y="335" class="label" text-anchor="start">FASTA</text><text x="180" y="368" class="tiny">Validated reference</text><text x="180" y="392" class="tiny">assembly and region</text>
  <text x="180" y="470" class="small">Load a genomic reference</text><text x="180" y="493" class="small">sequence for the target SNP.</text>

  <path d="M285 357H405" class="line" marker-end="url(#arrow)"/>
  <circle cx="480" cy="200" r="25" class="node"/><text x="480" y="208" class="step" fill="#0b0f12">2</text>
  <text x="480" y="250" class="step">SNP localisation</text>
  <path d="M400 358h160M480 310v100" class="line"/><circle cx="480" cy="326" r="18" fill="#0e1317" stroke="#a3e635" stroke-width="3"/><text x="480" y="332" class="tiny" fill="#a3e635">SNP</text><text x="480" y="482" class="small">Anchor the flanking sequence</text><text x="480" y="505" class="small">and confirm reference allele.</text>

  <path d="M585 357H695" class="line" marker-end="url(#arrow)"/>
  <polygon points="800,278 895,357 800,436 705,357" class="box" stroke="#a3e635"/>
  <text x="800" y="342" class="step" font-size="20">Does the SNP affect</text><text x="800" y="368" class="step" font-size="20">a useful restriction site?</text>
  <text x="800" y="474" class="small">Verify motif, cut position and</text><text x="800" y="497" class="small">expected fragment resolution.</text>

  <path d="M895 357H970" class="green" marker-end="url(#arrowg)"/><text x="930" y="338" class="label">YES</text>
  <rect x="985" y="174" width="500" height="365" rx="18" class="branch"/>
  <text x="1235" y="212" class="label">PCR-RFLP PATH</text>
  <circle cx="1055" cy="258" r="22" class="node"/><text x="1055" y="266" class="step" fill="#0b0f12">3</text><text x="1055" y="294" class="step" font-size="15">Primer</text><text x="1055" y="313" class="step" font-size="15">design</text>
  <circle cx="1215" cy="258" r="22" class="node"/><text x="1215" y="266" class="step" fill="#0b0f12">4</text><text x="1215" y="294" class="step" font-size="15">In silico</text><text x="1215" y="313" class="step" font-size="15">PCR</text>
  <circle cx="1375" cy="258" r="22" class="node"/><text x="1375" y="266" class="step" fill="#0b0f12">5</text><text x="1375" y="294" class="step" font-size="15">Restriction</text><text x="1375" y="313" class="step" font-size="15">analysis</text>
  <path d="M1080 258h105M1240 258h105" class="green" marker-end="url(#arrowg)"/>
  <path d="M1055 350h320" class="green"/><path d="M1055 350v38M1215 350v38M1375 350v38" class="green"/>
  <text x="1055" y="415" class="small">Rank compatible</text><text x="1055" y="437" class="small">primer pairs</text>
  <text x="1215" y="415" class="small">Confirm product</text><text x="1215" y="437" class="small">and binding sites</text>
  <text x="1375" y="415" class="small">Compare alleles,</text><text x="1375" y="437" class="small">fragments and gel</text>
  <text x="1235" y="495" class="tiny">Output: candidate assay, restriction pattern and virtual agarose gel</text>

  <path d="M800 436V614H970" class="purple" marker-end="url(#arrowp)"/><text x="825" y="582" class="label" fill="#c084fc">NO</text>
  <rect x="985" y="598" width="500" height="280" rx="18" class="arms"/>
  <text x="1235" y="636" class="label" fill="#c084fc">TETRA-PRIMER ARMS-PCR PATH</text>
  <circle cx="1065" cy="685" r="22" fill="#c084fc"/><text x="1065" y="693" class="step" fill="#0b0f12">3</text><text x="1065" y="722" class="step" font-size="15">Four-primer</text><text x="1065" y="741" class="step" font-size="15">design</text>
  <circle cx="1240" cy="685" r="22" fill="#c084fc"/><text x="1240" y="693" class="step" fill="#0b0f12">4</text><text x="1240" y="722" class="step" font-size="15">Product</text><text x="1240" y="741" class="step" font-size="15">simulation</text>
  <circle cx="1400" cy="685" r="22" fill="#c084fc"/><text x="1400" y="693" class="step" fill="#0b0f12">5</text><text x="1400" y="722" class="step" font-size="15">Virtual</text><text x="1400" y="741" class="step" font-size="15">gel</text>
  <path d="M1090 685h120M1265 685h110" class="purple" marker-end="url(#arrowp)"/>
  <text x="1065" y="780" class="small">Outer control +</text><text x="1065" y="802" class="small">allele-specific inner primers</text>
  <text x="1240" y="780" class="small">Predict ref/ref, ref/alt,</text><text x="1240" y="802" class="small">and alt/alt products</text>
  <text x="1400" y="780" class="small">Control and diagnostic</text><text x="1400" y="802" class="small">bands for three genotypes</text>
  <text x="1235" y="840" class="tiny">Output: ranked set, products, nucleotide map and virtual agarose gel</text>

  <rect x="115" y="890" width="1370" height="52" rx="14" fill="#0c1215" stroke="#4d7c0f" stroke-width="1.5"/>
  <text x="800" y="923" class="small">Both paths produce in silico candidates: independently verify genomic specificity, thermodynamics and experimental conditions before use.</text>
</svg>
